<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AMACEP | Inicio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --azul: #0A1A2A;
            --dorado: #C9A86A;
            --negro: #111111;
            --blanco: #FFFFFF;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background-color: var(--azul);
            color: var(--blanco);
        }

        /* Barra dorada superior */
        .barra-superior {
            background-color: var(--dorado);
            height: 6px;
            width: 100%;
        }

        /* Header institucional */
        header {
            background-color: var(--azul);
            padding: 1rem 0;
            border-bottom: 4px solid var(--dorado);
        }

        .contenedor {
            max-width: 1200px;
            margin: auto;
            padding: 0 1.5rem;
        }

        .header-flex {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-header {
            height: 70px;
        }

        nav {
            margin-top: 1rem;
        }

        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--blanco);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        nav a:hover {
            background-color: var(--dorado);
            color: var(--azul);
        }

        /* Hero editorial */
        .hero {
            min-height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .hero img.logo {
            width: 240px;
            max-width: 70%;
            margin-bottom: 1.5rem;
        }

        .sigla {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin: 0;
            text-transform: uppercase;
        }

        .nombre-completo {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            margin-top: 0.6rem;
            text-transform: uppercase;
        }

        .fundada {
            margin-top: 2rem;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .sunarp {
            margin-top: 0.3rem;
            font-size: 1rem;
            color: var(--dorado);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        /* Redes sociales rectangulares */
        .redes {
            margin-top: 3rem;
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .redes img {
            height: 42px;
            width: auto;
            border-radius: 6px;
            background-color: var(--blanco);
            padding: 6px 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            transition: 0.2s;
        }

        .redes img:hover {
            transform: scale(1.07);
        }

        /* Botón flotante de WhatsApp */
        .whatsapp-btn {
            position: fixed;
            right: 22px;
            bottom: 22px;
            background-color: #25D366;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            z-index: 9999;
            transition: 0.2s;
        }

        .whatsapp-btn:hover {
            transform: scale(1.10);
        }

        .whatsapp-btn img {
            width: 34px;
            height: 34px;
        }

        /* Móvil */
        @media (max-width: 768px) {
            .hero img.logo {
                width: 180px;
            }

            .sigla {
                font-size: 2.5rem;
            }

            .nombre-completo {
                font-size: 1.1rem;
            }

            .redes img {
                height: 36px;
            }
        }
    </style>
</head>

<body>

<div class="barra-superior"></div>

<header>

            <div class="titulo">
                <h1 style="margin:0; font-size:1.4rem;">Asociación de Maestros de Ceremonias del Perú</h1>
            </div>
        </div>

        <nav>
            <ul>
                <li><a href="amacep.html">Inicio</a></li>
                <li><a href="amacepnosotros.html">Nosotros</a></li>
                <li><a href="#estatuto">Estatuto</a></li>

                <li><a href="#asociados">Asociados</a></li>
                <li><a href="#galeria">Galería</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </div>
</header>
