<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AMACEP | Inicio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --azul: #0A1A2A;
            --dorado: #C9A86A;
            --negro: #111111;
            --blanco: #FFFFFF;
            --gris: #F5F6F8;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background-color: var(--blanco);
            color: var(--negro);
        }

        /* Hero editorial */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .hero img.logo {
            width: 240px;
            max-width: 70%;
            margin-bottom: 1.5rem;
        }

        .sigla {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--azul);
            margin: 0;
            text-transform: uppercase;
        }

        .nombre-completo {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            margin-top: 0.6rem;
            color: var(--negro);
            text-transform: uppercase;
        }

        .fundada {
            margin-top: 2rem;
            font-size: 1.05rem;
            color: var(--azul);
            font-weight: 600;
        }

        .sunarp {
            margin-top: 0.3rem;
            font-size: 1rem;
            color: var(--dorado);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        /* Redes sociales rectangulares */
        .redes {
            margin-top: 3rem;
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .redes img {
            height: 42px;
            width: auto;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: 0.2s;
        }

        .redes img:hover {
            transform: scale(1.07);
        }

        /* Botón flotante de WhatsApp */
        .whatsapp-btn {
            position: fixed;
            right: 22px;
            bottom: 22px;
            background-color: #25D366;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            z-index: 9999;
            transition: 0.2s;
        }

        .whatsapp-btn:hover {
            transform: scale(1.10);
        }

        .whatsapp-btn img {
            width: 34px;
            height: 34px;
        }

        /* Móvil */
        @media (max-width: 768px) {
            .hero img.logo {
                width: 180px;
            }

            .sigla {
                font-size: 2.5rem;
            }

            .nombre-completo {
                font-size: 1.1rem;
            }

            .redes img {
                height: 36px;
            }
        }
    </style>
</head>

<body>

<div class="hero">

    <!-- Logotipo AMACEP -->
    <img src="AMACEP.png" class="logo" alt="Logotipo AMACEP">

    <!-- Sigla -->
    <h1 class="sigla">AMACEP</h1>

    <!-- Nombre completo -->
    <div class="nombre-completo">
        ASOCIACIÓN DE MAESTROS DE CEREMONIAS DEL PERÚ
    </div>

    <!-- Datos institucionales -->
    <div class="fundada">Fundada el 26 de marzo de 2025</div>
    <div class="sunarp">SUNARP N° PARTIDA: 11077767</div>

    <!-- Redes sociales rectangulares -->
    <div class="redes">
        <a href="https://facebook.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png">
        </a>

        <a href="https://instagram.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
        </a>

        <a href="https://twitter.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/X_logo_2023.svg">
        </a>

        <a href="https://tiktok.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg">
        </a>

        <a href="https://pinterest.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Pinterest-logo.png">
        </a>

        <a href="https://youtube.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg">
        </a>
    </div>

</div>

<!-- Botón flotante de WhatsApp -->
<a href="https://wa.me/930046681" class="whatsapp-btn" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
</a>

</body>
</html>
